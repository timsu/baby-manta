name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # SQLite — no database service to spin up. The same DATABASE_URL that CI
    # uses is what a developer runs locally, so integration tests are never
    # silently skipped.
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @manta/db generate
      - name: Apply migrations
        run: pnpm --filter @manta/db exec prisma migrate deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
  # e2e (Playwright) runs on staging deploy, not in PR CI — see docs/TESTING.md.
